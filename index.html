<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Reporter | Soft Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Assistant', sans-serif; 
            background: linear-gradient(135deg, #fff5f8 0%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(244, 143, 177, 0.3);
            box-shadow: 0 20px 60px rgba(236, 64, 122, 0.1);
        }
        .input-soft {
            background: rgba(255, 255, 255, 0.8);
            border: 1.5px solid #fce4ec;
            transition: all 0.3s ease;
        }
        .input-soft:focus {
            border-color: #f06292;
            box-shadow: 0 0 12px rgba(240, 98, 146, 0.2);
            outline: none;
        }
        .btn-feminine {
            background: linear-gradient(45deg, #f06292, #ba68c8);
            box-shadow: 0 8px 20px rgba(240, 98, 146, 0.3);
            transition: all 0.3s ease;
        }
        .btn-feminine:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 12px 25px rgba(240, 98, 146, 0.4);
        }
        .btn-feminine:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-xl w-full glass-panel rounded-[3rem] p-10 md:p-14 text-center">
        <div class="mb-10">
            <div class="inline-flex p-5 bg-white rounded-full mb-5 shadow-sm border border-pink-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-pink-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">מפיק דוחות מניות</h1>
            <p class="text-pink-500 font-medium mt-2">הורדה מקומית • עיצוב עתידני רך</p>
        </div>

        <form id="stockForm" class="space-y-6 text-right" dir="rtl">
            <div>
                <label class="block text-gray-600 font-semibold mb-2 mr-1">סימולי מניות (מופרדים בפסיק):</label>
                <input type="text" id="tickers" placeholder="למשל: TSLA, AAPL, NVDA" required
                    class="w-full px-6 py-4 rounded-2xl input-soft text-lg">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-gray-600 font-semibold mb-2 mr-1 text-sm">תאריך התחלה:</label>
                    <input type="date" id="startDate" required class="w-full px-4 py-3 rounded-2xl input-soft">
                </div>
                <div>
                    <label class="block text-gray-600 font-semibold mb-2 mr-1 text-sm">תאריך סיום:</label>
                    <input type="date" id="endDate" required class="w-full px-4 py-3 rounded-2xl input-soft">
                </div>
            </div>

            <div>
                <label class="block text-gray-600 font-semibold mb-2 mr-1">תדירות נתונים:</label>
                <select id="frequency" class="w-full px-4 py-3 rounded-2xl input-soft outline-none bg-white">
                    <option value="1d">יומי (Daily)</option>
                    <option value="1wk">שבועי (Weekly)</option>
                    <option value="1mo">חודשי (Monthly)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full text-white font-bold py-5 rounded-2xl btn-feminine text-xl mt-4">
                הורד קובץ CSV למחשב
            </button>
        </form>

        <p id="statusMsg" class="mt-6 text-pink-500 font-medium hidden animate-pulse">מעבד נתונים, ההורדה תחל בקרוב...</p>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxftCaoFZDO2Bt8n7AUfZ38L03djVIwOSVpOc86ykS-gdsjScexRBH-_dEM1N_6DgT5/exec';

        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');

            let startDate = document.getElementById('startDate').value;
            let endDate = document.getElementById('endDate').value;

            // בדיקת ולידציה לתאריכים הפוכים
            if (new Date(startDate) > new Date(endDate)) {
                alert("שים לב: תאריך ההתחלה מאוחר מתאריך הסיום. המערכת תהפוך אותם עבורך.");
                let temp = startDate;
                startDate = endDate;
                endDate = temp;
            }

            const payload = {
                tickers: document.getElementById('tickers').value.split(',').map(s => s.trim().toUpperCase()),
                startDate: startDate,
                endDate: endDate,
                frequency: document.getElementById('frequency').value
            };

            btn.disabled = true;
            btn.innerText = "מכין קובץ...";
            status.classList.remove('hidden');

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const csvData = await response.text();

                if (csvData.startsWith("Error")) {
                    alert("שגיאה מהשרת: " + csvData);
                } else {
                    // יצירת הורדה מקומית בדפדפן
                    const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.style.display = "none";
                    a.href = url;
                    a.download = `Stock_Report_${new Date().getTime()}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    status.innerText = "ההורדה הושלמה!";
                }
            } catch (err) {
                alert("שגיאה בחיבור לשרת. וודא שהסקריפט מפורסם כ-Anyone.");
            } finally {
                btn.disabled = false;
                btn.innerText = "הורד קובץ CSV למחשב";
                setTimeout(() => status.classList.add('hidden'), 3000);
            }
        });

        // הגדרת תאריכי ברירת מחדל (חצי שנה אחורה)
        const today = new Date();
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        const lastSixMonths = new Date();
        lastSixMonths.setMonth(today.getMonth() - 6);
        document.getElementById('startDate').value = lastSixMonths.toISOString().split('T')[0];
    </script>
</body>
</html>
