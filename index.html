<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data To Sheets | Ofek Cohen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
        .finance-gradient { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        <div class="finance-gradient p-8 text-white">
            <h1 class="text-3xl font-bold mb-2">מפיק דוחות מניות</h1>
            <p class="text-slate-300">איחוד נתוני מניות לגיליון Google Sheets</p>
        </div>

        <form id="stockForm" class="p-8 space-y-6">
            <div>
                <label class="block text-slate-700 font-bold mb-2">סימולי מניות:</label>
                <input type="text" id="tickers" placeholder="TSLA, AAPL, AMZN" required
                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-900 outline-none transition-all">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-700 font-bold mb-2">תאריך התחלה:</label>
                    <input type="date" id="startDate" required class="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none">
                </div>
                <div>
                    <label class="block text-slate-700 font-bold mb-2">תאריך סיום:</label>
                    <input type="date" id="endDate" required class="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2">תדירות:</label>
                <select id="frequency" class="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none bg-white">
                    <option value="daily">יומי (Daily)</option>
                    <option value="weekly">שבועי (Weekly)</option>
                    <option value="monthly">חודשי (Monthly)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex justify-center items-center">
                <span id="btnText">הפק גיליון נתונים</span>
                <div id="loader" class="hidden ml-3 animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
            </button>
        </form>

        <div id="resultArea" class="hidden p-8 border-t border-slate-100 bg-slate-50 text-center">
            <p class="text-green-600 font-bold mb-2">✓ הבקשה נשלחה בהצלחה!</p>
            <p class="text-sm text-slate-600 mb-4">הגיליון נוצר ב-Google Drive שלך.</p>
            <a href="https://drive.google.com/drive/recent" target="_blank" 
                class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full transition-colors">
                למעבר ל-Google Drive
            </a>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxtcXj8szQHHEZNsBHFtL1ybPjYM69m5e4DFqRpGXAyKlXPeJP7njQaeqs8447yKCqu/exec';

        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');

            const payload = {
                tickers: document.getElementById('tickers').value.split(',').map(s => s.trim().toUpperCase()),
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value
            };

            submitBtn.disabled = true;
            btnText.innerText = "מעבד נתונים...";
            loader.classList.remove('hidden');

            try {
                // שליחה בפורמט text/plain למניעת שגיאות Preflight CORS
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                // בגלל no-cors לא ניתן לקרוא את ה-JSON, אבל אם הגענו לכאן הבקשה נשלחה
                resultArea.classList.remove('hidden');
            } catch (error) {
                alert("שגיאה בחיבור לשרת.");
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = "הפק גיליון נתונים";
                loader.classList.add('hidden');
            }
        });

        // תאריכי ברירת מחדל
        const today = new Date().toISOString().split('T')[0];
        const lastMonth = new Date();
        lastMonth.setMonth(lastMonth.getMonth() - 1);
        document.getElementById('endDate').value = today;
        document.getElementById('startDate').value = lastMonth.toISOString().split('T')[0];
    </script>
</body>
</html>
