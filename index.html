<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת איחוד נתוני מניות | Ofek Cohen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; }
        .finance-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .loading-shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
        
        <div class="finance-gradient p-10 text-white text-center">
            <h1 class="text-3xl font-bold mb-2">מפיק דוחות פיננסיים</h1>
            <p class="text-slate-400">איחוד נתוני מניות מ-Yahoo ו-Google לגיליון אחד</p>
        </div>

        <form id="stockForm" class="p-8 space-y-6">
            
            <div>
                <label class="block text-slate-700 font-bold mb-2">סימולי מניות (הפרד בפסיקים):</label>
                <input type="text" id="tickers" placeholder="AAPL, TSLA, NVDA, AMZN" required
                    class="w-full px-5 py-4 rounded-xl border border-slate-300 focus:ring-4 focus:ring-blue-500/20 focus:border-blue-600 outline-none transition-all text-lg">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-slate-700 font-bold mb-2">תאריך התחלה:</label>
                    <input type="date" id="startDate" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
                <div>
                    <label class="block text-slate-700 font-bold mb-2">תאריך סיום:</label>
                    <input type="date" id="endDate" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-2">תדירות נתונים:</label>
                <select id="frequency" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none bg-white">
                    <option value="1d">יומי (Daily)</option>
                    <option value="1wk">שבועי (Weekly)</option>
                    <option value="1mo">חודשי (Monthly)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all transform hover:scale-[1.01] active:scale-95 flex justify-center items-center text-xl">
                <span id="btnText">צור גיליון נתונים</span>
                <div id="loader" class="hidden mr-3 animate-spin h-6 w-6 border-4 border-white border-t-transparent rounded-full"></div>
            </button>
        </form>

        <div id="resultArea" class="hidden p-8 border-t border-slate-100 bg-slate-50 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-2">הגיליון מוכן!</h3>
            <p class="text-slate-600 mb-6">הנתונים אוחדו בהצלחה והקובץ נשמר ב-Google Drive שלך.</p>
            <a id="sheetLink" href="#" target="_blank" 
                class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-4 px-10 rounded-2xl shadow-lg transition-all">
                פתח את הגיליון ב-Google Sheets
            </a>
            <div class="mt-4">
                <button onclick="window.location.reload()" class="text-slate-400 hover:text-slate-600 text-sm underline">הפק דוח נוסף</button>
            </div>
        </div>
    </div>

    <script>
        // הכתובת החדשה של ה-Web App שלך
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxiQnCjIO4qLdeadQRdkkAjiRJxLOV2Px7c2gPCD4iCQ9HfVDIS8dH18ClQ_Lv3W_Mn/exec';

        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            const sheetLink = document.getElementById('sheetLink');

            // איסוף הנתונים
            const payload = {
                tickers: document.getElementById('tickers').value.split(',').map(s => s.trim().toUpperCase()),
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value
            };

            // מצב טעינה
            submitBtn.disabled = true;
            submitBtn.classList.add('loading-shimmer');
            btnText.innerText = "מושך נתונים ומאחד...";
            loader.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                // שליחת הבקשה לשרת
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // שימוש ב-no-cors כדי למנוע חסימת CORS מצד הדפדפן
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(payload)
                });

                // בגלל no-cors, לא ניתן לקרוא את ה-JSON שחוזר. 
                // לכן נציג הודעה למשתמש לגשת לדרייב או ננסה להפנות אותו לתוצאה כללית.
                
                setTimeout(() => {
                    btnText.innerText = "הושלם!";
                    loader.classList.add('hidden');
                    submitBtn.classList.remove('loading-shimmer');
                    resultArea.classList.remove('hidden');
                    
                    // כיוון ש-no-cors חוסם את ה-URL הספציפי, נפנה אותם ל-Drive הכללי שלהם
                    sheetLink.href = "https://drive.google.com/drive/recent";
                }, 2000);

            } catch (error) {
                console.error("Error:", error);
                alert("אירעה שגיאה בשליחת הבקשה. בדוק את חיבור האינטרנט או את הגדרות הסקריפט.");
                submitBtn.disabled = false;
                btnText.innerText = "צור גיליון נתונים";
                loader.classList.add('hidden');
            }
        });

        // הגדרת תאריכי ברירת מחדל (3 חודשים אחורה)
        const today = new Date();
        const start = new Date();
        start.setMonth(today.getMonth() - 3);
        
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        document.getElementById('startDate').value = start.toISOString().split('T')[0];
    </script>
</body>
</html>
